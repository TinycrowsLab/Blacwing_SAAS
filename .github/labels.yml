# Blackwing label catalogue: the single source of truth for every GitHub label in this
# repository (FOUND-016, #18). docs/labels.md explains when to apply each group and holds a
# table generated from this file.
#
# Apply it with scripts/sync-labels.mjs (it never deletes unless --prune is passed):
#   node scripts/sync-labels.mjs --dry-run                         # validate + list the catalogue
#   node scripts/sync-labels.mjs --dry-run --current labels.json   # diff against a snapshot
#   node scripts/sync-labels.mjs --repo OWNER/NAME                 # apply (needs GITHUB_TOKEN)
#   node scripts/sync-labels.mjs --write-docs                      # regenerate docs/labels.md
#
# Rules (enforced by the sync script and its tests):
#   - names are unique ignoring case (GitHub compares label names case-insensitively),
#     1-50 characters, no commas, no leading/trailing whitespace;
#   - colors are 6 hex digits without "#"; descriptions are 1-100 characters;
#   - every label in a group with a `prefix` starts with that prefix;
#   - to rename a label, change `name` and list the old name under `previously:` so the
#     sync renames it in place (issues keep the label) instead of creating a new one.
version: 1

groups:
  - id: type
    title: "Type"
    description: >-
      What kind of planned work an issue is. Every planned issue carries exactly one; bug reports carry `bug` instead.
    prefix: "type:"
    labels:
      - name: "type:epic"
        color: "5319E7"
        description: "Epic: parent issue that groups the task issues of one epic (docs/architecture/EPICS.md)"
      - name: "type:task"
        color: "1D76DB"
        description: "Task: one PR-sized unit of work written to the CONTEXT_PACK §11 standard"
      - name: "type:spike"
        color: "C5DEF5"
        description: "Spike: time-boxed investigation that ends in a decision or an ADR"

  - id: priority
    title: "Priority"
    description: >-
      Delivery priority (CONTEXT_PACK §11). Every planned task and epic carries exactly one.
    prefix: "priority:"
    labels:
      - name: "priority:P0"
        color: "B60205"
        description: "P0: needed for the first end-to-end grey-box run"
      - name: "priority:P1"
        color: "D93F0B"
        description: "P1: v1 must-have"
      - name: "priority:P2"
        color: "FBCA04"
        description: "P2: v1 should-have"
      - name: "priority:P3"
        color: "0E8A16"
        description: "P3: nice-to-have or Later"

  - id: size
