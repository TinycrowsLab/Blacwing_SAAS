name: test

# Unit-test job (CI-003, #137): `pnpm test:ci` runs every workspace member's Vitest suite with v8
# coverage and JUnit output, after guarding against focused (.only) and unlinked skipped tests, and
# fails on coverage under the floors in coverage-thresholds.json (ratchet them up, never down),
# skipped tests, or obsolete snapshots. Integration (CI-004), Go (CI-005) and e2e (CI-006) run elsewhere.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      # Fixed fast-check seed: a failing property test fails identically on re-run.
      BW_FC_SEED: '20240101'
    steps:
      # A local composite action is only readable after a checkout; fetch just its directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The k3s and ingress schema tests need kubeconform; CI sets CI=true, so a missing binary fails there.
      - name: Install kubeconform (checksum-verified)
        env:
          KUBECONFORM_VERSION: '0.8.0'
          KUBECONFORM_SHA256: '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883'
        run: |
          set -euo pipefail
          tarball="kubeconform-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${tarball}"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The gitleaks ruleset self-test (scripts/secret-scan.test.mjs) runs the real binary; same pin as secret-scan.yml.
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Unit tests with coverage
        run: pnpm test:ci
      - name: Upload coverage and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-reports
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: warn
          retention-days: 14

  # Storybook build (issue #271): every kit story compiles into a static site. The stories' interaction and
  # a11y checks run in the unit job (packages/ui/src/storybook.test.tsx), so this job proves the build only.
  storybook:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Storybook
        run: pnpm --filter @blackwing/ui build-storybook
      - name: Upload Storybook build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          if-no-files-found: error
          retention-days: 14

  # Integration job (CI-004, #138): Testcontainers boots Postgres/Valkey/Neo4j/MinIO on the runner's
  # Docker daemon (random ports, never reused). Images come from infra/images.lock, the same
  # digests the helpers and the dev compose stack use. No secrets, read-only token.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: UTC
      # Every container is fresh per run: reuse stays off so CI never sees another run's state.
      BW_FC_SEED: '20240101'
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      BW_TESTCONTAINERS_REUSE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pre-pull data-service images (retry)
        run: |
          set -euo pipefail
          while IFS='=' read -r name ref; do
            case "$name" in ''|'#'*) continue ;; esac
            for attempt in 1 2 3 4; do
              if docker pull --quiet "$ref" >/dev/null; then break; fi
              if [ "$attempt" -eq 4 ]; then echo "failed to pull $name ($ref)" >&2; exit 1; fi
              echo "pull of $name failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 5))
            done
          done < infra/images.lock
      # apps/worker integration tests talk to Temporal on 127.0.0.1:17233 in the blackwing-dev namespace
      # (not Testcontainers). Start the same compose services `pnpm dev:deps` uses (pinned digests in
      # infra/compose), then run temporal-bootstrap to create the namespace and search attributes.
      - name: Start Temporal dev stack
        run: |
          set -euo pipefail
          node scripts/dev-deps.mjs config
          compose() { docker compose -p bwdev --env-file .env -f infra/compose/docker-compose.dev.yml "$@"; }
          compose up -d --wait --wait-timeout 300 temporal
          compose up --exit-code-from temporal-bootstrap temporal-bootstrap
      - name: Integration tests (includes cross-tenant RLS denial, 8.6)
        run: pnpm test:int:ci
      - name: Dump container logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p integration-logs
          docker ps -a > integration-logs/docker-ps.txt || true
          for id in $(docker ps -aq); do
            docker logs --tail 500 "$id" > "integration-logs/$id.log" 2>&1 || true
          done
      - name: Upload JUnit reports and container logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-reports
          path: |
            apps/*/reports/junit-int.xml
            packages/*/reports/junit-int.xml
            integration-logs
          if-no-files-found: warn
          retention-days: 14

  # Cross-tenant isolation gate (TENANT-003, #102, CONTEXT_PACK §8.6): the real migrations on a
  # Testcontainers Postgres, asserted as bw_app. Required on every PR; a failure means a tenant
  # table lost RLS, fails open without context, leaks across pooled connections or the role can bypass.
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      BW_FC_SEED: '20240101'
      TESTCONTAINERS_REUSE_ENABLE: 'false'
      BW_TESTCONTAINERS_REUSE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pre-pull the Postgres image (retry)
        run: |
          set -euo pipefail
          ref=$(grep '^postgres=' infra/images.lock | cut -d= -f2-)
          for attempt in 1 2 3 4; do
            if docker pull --quiet "$ref" >/dev/null; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "failed to pull $ref" >&2; exit 1
      - name: Cross-tenant isolation tests
        run: pnpm test:isolation -- --reporter=default --reporter=junit --outputFile.junit=reports/junit-isolation.xml
      - name: Upload the isolation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-report
          path: packages/db/reports/junit-isolation.xml
          if-no-files-found: warn
          retention-days: 14
