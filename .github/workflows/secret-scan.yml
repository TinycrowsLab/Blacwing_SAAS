name: secret-scan

# Gitleaks secret scanning (CI-012, #146; CONTEXT_PACK §8.7). Pull requests and pushes scan only the
# new commits (fast on a large history); the weekly schedule and manual runs scan the full history.
# The ruleset is .gitleaks.toml, shared with the pre-commit hook. Every scan runs with --redact, the
# SARIF report goes to the Security tab (code scanning, category `gitleaks`) and the job summary
# carries counts only. Any non-allowlisted finding fails the job.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC: full-history scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan
        id: scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          zero=0000000000000000000000000000000000000000
          range=''
          mode='full'
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"; mode='pr'
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"; mode='push'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          args=(detect --redact --no-banner --config .gitleaks.toml --exit-code 1
                --report-format sarif --report-path gitleaks.sarif)
          if [ -n "$range" ]; then args+=(--log-opts "$range"); fi
          gitleaks "${args[@]}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Summary (counts only)
        if: always() && hashFiles('gitleaks.sarif') != ''
        env:
          MODE: ${{ steps.scan.outputs.mode }}
        run: node scripts/gitleaks-summary.mjs gitleaks.sarif --mode "$MODE"
      - name: Upload SARIF to the Security tab
        # Forked pull requests get a read-only token and cannot upload; their scan still gates.
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Fail on findings
        if: steps.scan.outputs.exit != '0'
        env:
          CODE: ${{ steps.scan.outputs.exit }}
        run: |
          echo "::error::gitleaks found secrets or failed (exit $CODE). Rotate first: docs/runbooks/secret-scanning.md"
          exit 1

  # Proves the ruleset itself: a planted fake bw_pat_ token fails, an allowlisted fixture passes, and
  # no scan output ever contains the secret value.
  ruleset-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Ruleset self-test
        run: node --test scripts/secret-scan.test.mjs scripts/gitleaks-summary.test.mjs
