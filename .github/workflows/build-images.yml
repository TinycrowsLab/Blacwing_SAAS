name: build-images

# Container image matrix (CI-007, #141): one image per long-running Blackwing service, pushed to
# GHCR as ghcr.io/tinycrowslab/bw-<service> and recorded by immutable sha256 digest in the
# images.json artifact that SBOM (CI-008), scan (CI-009), signing (CI-010) and deploy (CI-017,
# INFRA-009) consume. The `sbom` job (CI-008, #142) scans each digest with Syft, validates the
# CycloneDX 1.5 output and attaches it to the image in GHCR. The per-run bw-sandbox image is NOT part of this matrix: IMAGE-012 owns it.
# scripts/check-images.mjs (job `guard`) fails the workflow if it ever appears here.

on:
  pull_request:
    paths:
      - .github/workflows/build-images.yml
      - infra/docker/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .dockerignore
      - scripts/check-images.mjs
      - scripts/build-images-json.mjs
      - scripts/check-sbom.mjs
      - scripts/check-trivy.mjs
      - .trivyignore
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/tinycrowslab
  # Push only from trusted events on main or a release tag, never from pull requests (so fork PRs
  # can never reach the GHCR token), and only once the online tier is enabled.
  # OFFLINE-STUB(online-porting #874): GHCR push stays off until BW_ONLINE is set to 'true'.
  PUSH: ${{ github.event_name != 'pull_request' && vars.BW_ONLINE == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only node is needed: the guard has one dependency-free entry point plus `yaml`, so install
      # through the shared setup action.
      - uses: ./.github/actions/setup
      - name: Matrix, registry and base-image guard
        run: node scripts/check-images.mjs

  build:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # used only when PUSH is true; the login step is skipped otherwise
    strategy:
      fail-fast: false # one broken Dockerfile must not hide the other services' results
      matrix:
        include:
          - service: api
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: web
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: worker
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: agent-runtime
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: model-gateway
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: egress-gateway
            file: apps/egress-gateway/Dockerfile
            context: apps/egress-gateway
            platforms: 'linux/amd64,linux/arm64'
          - service: session-manager
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: sandbox-controller
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
          - service: cli
            file: infra/docker/service.Dockerfile
            context: .
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute tags
        id: meta
        env:
          IMAGE: ${{ env.REGISTRY }}/bw-${{ matrix.service }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Always a git-SHA tag; a semver tag on release. Never `latest` alone: consumers use the digest.
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF#refs/tags/v}"
            tags="${tags},${IMAGE}:${version}"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          {
            echo "tags=${tags}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on trusted events)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          # The layer cache is optional: a corrupt or missing cache only slows the build down.
          cache-from: type=gha,scope=bw-${{ matrix.service }}
          cache-to: ${{ env.PUSH == 'true' && format('type=gha,mode=max,scope=bw-{0},ignore-error=true', matrix.service) || '' }}
          provenance: false
      - name: Record digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:[0-9a-f]*) ;; *) echo "::error::no sha256 digest for ${SERVICE}"; exit 1 ;; esac
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${SERVICE}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          if-no-files-found: error

  images-json:
    # Runs only after every service pushed; a failed service leaves no partial images.json.
    needs: build
    if: needs.build.result == 'success' && vars.BW_ONLINE == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Assemble images.json
        run: node scripts/build-images-json.mjs --digests digests --out images.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images.json
          path: images.json
          if-no-files-found: error

  sbom:
    # CycloneDX 1.5 SBOM per image, scanned by immutable digest from images.json (never by tag),
    # validated (empty/invalid fails the job), attached to the image in GHCR and uploaded as an
    # artifact. Online-only and never on forks or pull requests, so the packages:write token is
    # not reachable from untrusted code. Signing the SBOM is CI-010; scanning is CI-009.
    # OFFLINE-STUB(online-porting #874): attach needs GHCR, so the job stays off until BW_ONLINE is set.
    needs: images-json
    if: vars.BW_ONLINE == 'true' && github.event_name != 'pull_request' && github.event.repository.fork == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # large images: bounds the Syft scan
    permissions:
      contents: read
      packages: write # least privilege: attach the SBOM to the image, nothing else
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - worker
          - agent-runtime
          - model-gateway
          - egress-gateway
          - session-manager
          - sandbox-controller
          - cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          checkout: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images.json
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and validate SBOM
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          ref="$(jq -er --arg s "$SERVICE" '.[$s]' images.json)"
          case "$ref" in *@sha256:*) ;; *) echo "::error::${SERVICE} is not pinned by digest"; exit 1 ;; esac
          mkdir -p sboms
          # Scan the digest, not a tag; linux/amd64 picks one manifest from multi-arch indexes.
          syft scan "registry:${ref}" --platform linux/amd64 -o "cyclonedx-json@1.5=sboms/${SERVICE}.cdx.json"
          node scripts/check-sbom.mjs --service "$SERVICE" --sbom "sboms/${SERVICE}.cdx.json" --image "$ref" --summary "$GITHUB_STEP_SUMMARY"
      - name: Attach SBOM to the image in GHCR
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          ref="$(jq -er --arg s "$SERVICE" '.[$s]' images.json)"
          cosign attach sbom --sbom "sboms/${SERVICE}.cdx.json" --type cyclonedx "$ref"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: sboms/${{ matrix.service }}.cdx.json
          if-no-files-found: error

  trivy:
    # Trivy image scan by immutable digest from images.json (never by tag, CI-009, #143): SARIF to
    # code scanning, then a gate that fails on fixable HIGH/CRITICAL findings not in .trivyignore.
    # Online-only like sbom; the repo (fs/config) scan in trivy.yml runs offline-capable on every PR.
    # OFFLINE-STUB(online-porting #874): scanning pulls from GHCR, so the job stays off until BW_ONLINE is set.
    needs: images-json
    if: vars.BW_ONLINE == 'true' && github.event_name != 'pull_request' && github.event.repository.fork == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning only
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - worker
          - agent-runtime
          - model-gateway
          - egress-gateway
          - session-manager
          - sandbox-controller
          - cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          checkout: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images.json
      - name: Resolve digest
        id: ref
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          node scripts/check-trivy.mjs ignore
          ref="$(jq -er --arg s "$SERVICE" '.[$s]' images.json)"
          case "$ref" in *@sha256:*) ;; *) echo "::error::${SERVICE} is not pinned by digest"; exit 1 ;; esac
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: '0'
          limit-severities-for-sarif: true
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
      - name: Summarise findings
        env:
          SERVICE: ${{ matrix.service }}
        run: node scripts/check-trivy.mjs summary --sarif "trivy-${SERVICE}.sarif" --label "$SERVICE" --summary "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@48870fdd6b42ee6474ec4207209ff87609271a5e # v4.39.0
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}
      - name: Severity gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: 'true'
          TRIVY_SKIP_CHECK_UPDATE: 'true'
