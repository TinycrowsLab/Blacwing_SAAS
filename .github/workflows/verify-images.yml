name: verify-images

# Deploy-time supply-chain gate (CI-011, #145). Reusable only: deploy workflows (CI-017, CI-018)
# call it and make their rollout job `needs: verify-images`, so a failure here aborts the deploy.
# For every digest in the images.json artifact it runs `cosign verify` plus `cosign
# verify-attestation` for the CycloneDX SBOM and the SLSA v1 provenance, against the exact
# identity and issuer in infra/docker/signing-identity.json (the file the CI-010 sign job uses),
# then re-checks the output in scripts/verify-images.mjs. Unsigned, foreign-signed, missing
# attestation, Rekor or registry lookup failure and timeouts all fail closed: never deploy
# unverified. Verified digests and identities go to the step summary. See
# docs/runbooks/image-verification.md.
# OFFLINE-STUB(online-porting #874): needs GHCR + Sigstore (Fulcio/Rekor/TUF); callers stay gated on BW_ONLINE.

on:
  workflow_call:
    inputs:
      images-artifact:
        description: Name of the uploaded images.json artifact (service -> ref@sha256:...).
        type: string
        required: false
        default: images.json
      services:
        description: Comma-separated services to verify; empty verifies every entry.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify-images:
    name: verify-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # read signatures and attestations from GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          checkout: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.images-artifact }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signatures and attestations (fail closed)
        env:
          SERVICES: ${{ inputs.services }}
        run: node scripts/verify-images.mjs --images images.json --services "$SERVICES" --summary "$GITHUB_STEP_SUMMARY"
