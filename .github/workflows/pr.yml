name: pr

# Pull-request gate (CI-002, #136): ESLint with zero warnings plus the Prettier check, commit
# messages (Conventional Commits) and the project-wide typecheck, on every pull request and every
# push to main. The job names `lint`, `typecheck`, `commitlint` and `boundaries` are the required status checks
# that branch protection references (CI-019): never rename them, and never give them a matrix
# (a matrix appends its values to the check name). Node 22 is the single supported version.
#
# `boundaries` (#870) runs the architectural dependency check and is never skipped, so a docs-only
# edit of docs/architecture/dependency-graph.md still fails it when the file is stale.
#
# Unit, integration, e2e and Go jobs live in their own workflows (CI-003, CI-004, CI-006, CI-005).
# No job needs a secret; forked pull requests get read-only caches from the setup action.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or per pushed ref): a newer push cancels the superseded run.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_COLOR: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Docs-only change sets let ESLint and tsc skip. The classifier fails closed: anything it cannot
  # prove to be docs-only (or a failure of this job) runs every check.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify the change set
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/ci-pr.mjs changes

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A local composite action is only readable after a checkout; fetch just its directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          fetch-depth: '1'
      - uses: ./.github/actions/problem-matchers
      - name: ESLint (zero warnings)
        id: eslint
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          set -o pipefail
          pnpm lint 2>&1 | node scripts/ci-annotate.mjs --task lint
      # Runs even when ESLint failed, so one push reports both. Line endings are LF everywhere
      # (.gitattributes), so this check is stable across platforms.
      - name: Prettier check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm format:check
      # Prompt lint (#652): structure, forbidden content, standard IDs and placeholders of every persona
      # prompt and the base preamble. Not skipped for docs-only change sets: prompts are .md files.
      - name: Prompt lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:prompts

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          fetch-depth: '1'
      - uses: ./.github/actions/problem-matchers
      # Turborepo restores cached typecheck results (the setup action restores .turbo), so a
      # re-run of an unchanged commit is a full cache hit; the job summary reports the hit rate.
      - name: Typecheck (tsc -b via Turborepo)
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | node scripts/ci-annotate.mjs --task typecheck

  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          fetch-depth: '0'
      # Lints every commit in the pull request (base..head), or every pushed commit (before..after).
      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/ci-pr.mjs commitlint

  # Architectural boundaries (FOUND-005, #7): `pnpm boundaries:report` fails on a forbidden import,
  # a cycle or a stale docs/architecture/dependency-graph.md. Never skipped (no `needs`/`if`): the
  # check takes seconds and a docs-only hand edit of the graph doc must fail it.
  boundaries:
    name: boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          fetch-depth: '1'
      - uses: ./.github/actions/problem-matchers
      # The script prints one `::error` annotation per violation when GITHUB_ACTIONS=true and
      # writes boundaries-report.json; exit 1 fails the job.
      - name: Check architectural boundaries
        run: |
          set -o pipefail
          pnpm boundaries:report
      - name: Job summary
        if: ${{ !cancelled() && hashFiles('boundaries-report.json') != '' }}
        run: |
          {
            echo '### Architectural boundaries'
            echo
            echo '```json'
            head -c 20000 boundaries-report.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload boundaries report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boundaries-report
          path: boundaries-report.json
          if-no-files-found: warn
          retention-days: 14

  # Always-running aggregator and the single required status check for this workflow
  # (.github/required-checks.json). `if: always()` makes it report even when a needed job fails or
  # is skipped, so a skipped job can never leave a required check pending. Skipped counts as
  # passing (the docs-only classifier skips lint/typecheck on purpose); failed or cancelled does not.
  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [changes, lint, typecheck, commitlint, boundaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every pull-request job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, n]) => !["success", "skipped"].includes(n.result));
            for (const [name, n] of bad) console.log(`::error::${name} finished with result ${n.result}`);
            process.exit(bad.length ? 1 : 0);
          '
