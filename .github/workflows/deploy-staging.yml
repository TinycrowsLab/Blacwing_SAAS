name: deploy-staging

# Staging deploy (CI-017, #151). Runs when a release is published (release.yml creates it) or on manual
# dispatch with an existing release tag. It resolves the release record and images.json, runs the CI-011
# signature gate (verify-images.yml) as a hard pre-step, and only then runs `helm upgrade --install
# --atomic` against the staging cluster with every image pinned by digest (scripts/helm-images.mjs).
# A failed upgrade rolls back by --atomic; a failed smoke check rolls back to the previous Helm revision.
# Secrets live only in the `staging` Environment and are never echoed. Helm is downloaded at the version
# and checksum pinned in infra/versions.env. Runbook: docs/runbooks/deploy-rollback.md.
#
# OFFLINE-STUB(online-porting #915): the live rollout needs the k3s staging cluster, the `staging`
# Environment secrets and the published images. The chart, the gate and this wiring are proven offline by
# scripts/deploy-staging.test.mjs (helm template runs in scripts/helm-blackwing.test.mjs).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy to staging, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: read

# One staging deploy at a time. A queued deploy waits; it is never cancelled half-way through a rollout.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # includes waiting for release.yml to attach the release record
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          checkout: 'false'
      - name: Download the release record and images.json (waits for release.yml)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          # release.yml uploads both files after the image build, so the release event can fire first.
          for _ in $(seq 1 60); do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                --pattern release-record.json --pattern images.json --dir "$RUNNER_TEMP/release" 2>/dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::release ${TAG} has no release-record.json and images.json"
          exit 1
      - name: Resolve and cross-check the release record against images.json (fail closed)
        id: resolve
        run: |
          set -euo pipefail
          node scripts/deploy-staging.mjs resolve --tag "$TAG" \
            --record "$RUNNER_TEMP/release/release-record.json" \
            --images "$RUNNER_TEMP/release/images.json" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images.json
          path: ${{ runner.temp }}/release/images.json
          if-no-files-found: error

  # CI-011: every digest in images.json must carry a valid cosign signature and the SBOM and provenance
  # attestations. Deploy is `needs: verify`, so any failure here aborts the deploy before the cluster changes.
  verify:
    name: verify
    needs: resolve
    permissions:
      contents: read
      packages: read # read signatures and attestations from GHCR
    uses: ./.github/workflows/verify-images.yml
    with:
      images-artifact: images.json

  deploy:
    name: deploy
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      HELM_NAMESPACE: bw-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chart and the sandbox digest come from the released commit, so the chart version is pinned.
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          checkout: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images.json
      - name: Install Helm (pinned version, checksum verified)
        run: |
          set -euo pipefail
          . infra/versions.env
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$HELM_SHA256_AMD64" ;;
            aarch64) arch=arm64; sha="$HELM_SHA256_ARM64" ;;
            *) echo "::error::unsupported runner architecture"; exit 1 ;;
          esac
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${arch}.tar.gz" -o "$RUNNER_TEMP/helm.tgz"
          echo "${sha}  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" "linux-${arch}/helm"
          install -m 0755 "$RUNNER_TEMP/linux-${arch}/helm" "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/helm" version --short
      - name: Write the staging kubeconfig (Environment secret, never printed)
        env:
          STAGING_KUBECONFIG_CONTENT: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_KUBECONFIG_CONTENT" ]; then
            echo "::error::STAGING_KUBECONFIG is not set in the staging Environment"
            exit 1
          fi
          umask 077
          printf '%s\n' "$STAGING_KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Render the digest-pinned image values (fail closed)
        run: |
          set -euo pipefail
          node scripts/helm-images.mjs --images-json images.json --out "$RUNNER_TEMP/bw-images.yaml"
      - name: Helm dry run against the cluster (server-side render)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/helm" upgrade --install blackwing infra/helm/blackwing \
            --namespace "$HELM_NAMESPACE" \
            -f infra/helm/blackwing/values-staging.yaml -f "$RUNNER_TEMP/bw-images.yaml" \
            --dry-run=server
      - name: 'Helm upgrade (atomic: rolls back a failed upgrade)'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/helm" upgrade --install blackwing infra/helm/blackwing \
            --namespace "$HELM_NAMESPACE" \
            -f infra/helm/blackwing/values-staging.yaml -f "$RUNNER_TEMP/bw-images.yaml" \
            --atomic --wait-for-jobs --timeout 10m --history-max 10 \
            --description "staging ${TAG} (${{ needs.resolve.outputs.commit }})"
      - name: Post-deploy smoke check
        id: smoke
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "::error::STAGING_BASE_URL is not set in the staging Environment"
            exit 1
          fi
          for _ in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$STAGING_BASE_URL/readyz" || true)"
            if [ "$code" = "200" ]; then
              echo "Smoke check passed: /readyz returned 200."
              exit 0
            fi
            sleep 10
          done
          echo "::error::smoke check failed: $STAGING_BASE_URL/readyz did not return 200"
          exit 1
      - name: 'Roll back to the previous Helm revision after a failed smoke check'
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/helm" rollback blackwing --namespace "$HELM_NAMESPACE" \
            --wait-for-jobs --timeout 10m --description "rollback: smoke check failed for ${TAG}"
      - name: Record the deployment (audit)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Staging Helm history"
            echo ""
            echo '```'
            "$RUNNER_TEMP/helm" history blackwing --namespace "$HELM_NAMESPACE" --max 3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
