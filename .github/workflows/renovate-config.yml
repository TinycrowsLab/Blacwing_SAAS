name: renovate-config

on:
  pull_request:
    paths:
      - renovate.json
      - scripts/check-renovate.mjs
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json

permissions:
  contents: read

concurrency:
  group: renovate-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Policy checks
        run: node scripts/check-renovate.mjs
      - name: renovate-config-validator
        run: npx --yes --package renovate@44.171.5 renovate-config-validator --strict renovate.json
