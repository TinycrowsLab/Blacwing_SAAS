name: dependency-review

# Required check: blocks PRs that add HIGH+ vulnerable or license-denied dependencies.
# OFFLINE-STUB(online-porting #875): live PR fixture verification and required-check setting.
# Policy lives in .github/dependency-review-config.yml; documented in docs/runbooks/dependency-review.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # PR comment summary only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
