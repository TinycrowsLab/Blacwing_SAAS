# Blackwing local dependency stack (DEVENV-002). Started by `pnpm dev:deps`.
#
# Rules (see infra/compose/README.md):
# - one shared project `bwdev` for every worktree; never `container_name:`;
# - host ports bind 127.0.0.1 only and are overridable via env (port already in use);
# - every image is pinned by tag AND digest (CONTEXT_PACK §8.9); Renovate bumps them;
# - credentials come from the untracked `.env` (`pnpm dev:deps` creates it from `.env.example`).
name: bwdev

x-defaults: &defaults
  restart: unless-stopped
  networks: [bw-dev]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

# Shared by every `targets` service: opt-in profile, own network, loopback-only ports (set per service).
x-target: &target
  profiles: [targets]
  restart: unless-stopped
  networks: [bw-targets]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    environment:
      POSTGRES_USER: ${BW_DEV_POSTGRES_SUPERUSER:-bw_admin}
      POSTGRES_PASSWORD: ${BW_DEV_POSTGRES_SUPERUSER_PASSWORD:?set BW_DEV_POSTGRES_SUPERUSER_PASSWORD in .env (pnpm dev:deps creates it)}
      POSTGRES_DB: ${BW_DEV_POSTGRES_DB:-blackwing}
      BW_APP_ROLE: ${BW_DEV_POSTGRES_APP_USER:-bw_app}
      BW_APP_PASSWORD: ${BW_DEV_POSTGRES_APP_PASSWORD:?set BW_DEV_POSTGRES_APP_PASSWORD in .env}
      BW_MIGRATOR_ROLE: ${BW_DEV_POSTGRES_MIGRATOR_USER:-bw_migrator}
      BW_MIGRATOR_PASSWORD: ${BW_DEV_POSTGRES_MIGRATOR_PASSWORD:?set BW_DEV_POSTGRES_MIGRATOR_PASSWORD in .env}
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=200']
    ports:
      - '127.0.0.1:${BW_DEV_POSTGRES_PORT:-15432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2g }

  valkey:
    <<: *defaults
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    environment:
      BW_VALKEY_PASSWORD: ${BW_DEV_VALKEY_PASSWORD:?set BW_DEV_VALKEY_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec valkey-server --appendonly yes --appendfsync everysec
        --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$BW_VALKEY_PASSWORD"
    ports:
      - '127.0.0.1:${BW_DEV_VALKEY_PORT:-16379}:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$BW_VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }

  neo4j:
    <<: *defaults
    image: neo4j:5.26-community@sha256:0a6e7aedf54a531f76286032d4365ead65b11cca05e4a15cdf23b8e53d6db02b
    # Wraps the stock entrypoint: starts Neo4j, then applies and verifies the tenantId guard
    # (neo4j/bootstrap/tenant-guard.cypher). The healthcheck passes only once the guard is proven.
    entrypoint: ['tini', '-g', '--', '/bw/bootstrap/start.sh']
    environment:
      NEO4J_AUTH: neo4j/${BW_DEV_NEO4J_PASSWORD:?set BW_DEV_NEO4J_PASSWORD in .env (min 8 chars)}
      BW_NEO4J_PASSWORD: ${BW_DEV_NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:${BW_DEV_NEO4J_HTTP_PORT:-17474}:7474'
      - '127.0.0.1:${BW_DEV_NEO4J_BOLT_PORT:-17687}:7687'
    volumes:
      - neo4jdata:/data
      - ./neo4j/conf:/conf:ro
      - ./neo4j/bootstrap:/bw/bootstrap:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f /tmp/bw-tenant-guard.ok && cypher-shell -u neo4j -p "$${BW_NEO4J_PASSWORD}" "RETURN 1" >/dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2560m }

  # S3-compatible evidence/report/transcript store with Object Lock (DEVENV-006). Upstream MinIO no
  # longer publishes Docker Hub images, so this is Chainguard's unmodified source build (AGPLv3, used as a
  # separate dev service only), same image as packages/testing.
  minio:
    <<: *defaults
    image: cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${BW_DEV_MINIO_ROOT_USER:-bw_minio_root}
      MINIO_ROOT_PASSWORD: ${BW_DEV_MINIO_ROOT_PASSWORD:?set BW_DEV_MINIO_ROOT_PASSWORD in .env (min 8 chars)}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - '127.0.0.1:${BW_DEV_MINIO_PORT:-19000}:9000'
      - '127.0.0.1:${BW_DEV_MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      # The image has no curl/wget; `mc ready` polls GET /minio/health/ready (cluster readiness).
      test: ['CMD', '/usr/bin/mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }

  # Idempotent bootstrap job: buckets with object lock + versioning, default retention, scoped app key.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:0d96f662c23c9823874b47b6598cd7352edd9037891cba302d8fd3323dad295b
    restart: 'no'
    networks: [bw-dev]
    depends_on:
      minio: { condition: service_healthy }
    # Stays up after a successful bootstrap so `up --wait` can gate on the healthcheck below; a failed
    # bootstrap exits non-zero and fails `up`.
    entrypoint: ['/bin/bash', '-c', '/bw/minio/bootstrap.sh && exec sleep infinity']
    healthcheck:
      # So that `up --wait` blocks until the buckets exist (the script writes the marker last).
      test: ['CMD', '/bin/bash', '-c', 'test -f /tmp/bw-minio-bootstrap.ok']
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 5s
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${BW_DEV_MINIO_ROOT_USER:-bw_minio_root}
      MINIO_ROOT_PASSWORD: ${BW_DEV_MINIO_ROOT_PASSWORD:?set BW_DEV_MINIO_ROOT_PASSWORD in .env}
      BW_APP_ACCESS_KEY: ${BW_DEV_MINIO_APP_ACCESS_KEY:-bw_app_s3}
      BW_APP_SECRET_KEY: ${BW_DEV_MINIO_APP_PASSWORD:?set BW_DEV_MINIO_APP_PASSWORD in .env (min 8 chars)}
      BW_RETENTION_MODE: ${BW_DEV_MINIO_RETENTION_MODE:-GOVERNANCE}
      BW_RETENTION_DAYS: ${BW_DEV_MINIO_RETENTION_DAYS:-1}
    volumes:
      - ./minio:/bw/minio:ro

  # Dev TLS reverse proxy (DEVENV-013): terminates mkcert HTTPS for *.bw.localhost. Opt-in profile `tls`;
  # `pnpm dev:tls` runs infra/compose/tls/setup-tls.sh first. Apps on the host are reached via host-gateway.
  traefik:
    <<: *defaults
    image: traefik:v3.2@sha256:e561a37f8710d9cf41c78bdf421d822b2c0b48267ec0552e644565fb55466ea9
    profiles: [tls]
    command: ['--configFile=/etc/traefik/traefik.yml']
    environment:
      BW_TLS_PUBLIC_HTTPS_PORT: ${BW_DEV_TRAEFIK_HTTPS_PORT:-18443}
      BW_TLS_UPSTREAM_WEB: ${BW_TLS_UPSTREAM_WEB:-http://host.docker.internal:3000}
      BW_TLS_UPSTREAM_API: ${BW_TLS_UPSTREAM_API:-http://host.docker.internal:13400}
      BW_TLS_UPSTREAM_KEYCLOAK: ${BW_TLS_UPSTREAM_KEYCLOAK:-http://keycloak:8080}
      BW_TLS_UPSTREAM_JUICE: ${BW_TLS_UPSTREAM_JUICE:-http://juice-shop:3000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # 443 needs privileges: default to high ports (set BW_DEV_TRAEFIK_HTTPS_PORT=443 where allowed).
      - '127.0.0.1:${BW_DEV_TRAEFIK_HTTPS_PORT:-18443}:443'
      - '127.0.0.1:${BW_DEV_TRAEFIK_HTTP_PORT:-18000}:80'
      - '127.0.0.1:${BW_DEV_TRAEFIK_DASHBOARD_PORT:-18082}:8080'
    volumes:
      - ./tls/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./tls/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./tls/certs:/certs:ro
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128m }

  # Local SMTP sink + web UI (DEVENV-008). Nothing is ever relayed: mail stays in Mailpit's in-memory store,
  # so dev cannot contact real recipients. Messages vanish on restart (see README for reset).
  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    environment:
      MP_MAX_MESSAGES: ${BW_DEV_MAILPIT_MAX_MESSAGES:-500}
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:${BW_DEV_MAILPIT_SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${BW_DEV_MAILPIT_UI_PORT:-18025}:8025'
    healthcheck:
      # Probes the web UI's /readyz.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }

  # Self-hosted out-of-band (OOB) callback server for the validator's OOB oracle (DEVENV-008). Local-only
  # mode: authenticated with a token, no ACME/TLS, interactions held in memory. Only the HTTP collaborator
  # API/callbacks and DNS are published; there is no public DNS delegation for the dev domain.
  interactsh:
    <<: *defaults
    image: projectdiscovery/interactsh-server:v1.2.4@sha256:ffde50de2cdc9113b9bb024d9dbe63a7a4826de213be1cc63a7ffd5fd3b14481
    command:
      - -domain
      - ${BW_DEV_INTERACTSH_DOMAIN:-oob.bw.localhost}
      - -ip
      - 127.0.0.1
      - -token
      - ${BW_DEV_INTERACTSH_TOKEN:?set BW_DEV_INTERACTSH_TOKEN in .env (pnpm dev:deps creates it)}
      - -skip-acme
      - -disable-update-check
      - -eviction
      - '1'
    ports:
      - '127.0.0.1:${BW_DEV_INTERACTSH_HTTP_PORT:-18081}:80'
      - '127.0.0.1:${BW_DEV_INTERACTSH_DNS_PORT:-15353}:53/udp'
      - '127.0.0.1:${BW_DEV_INTERACTSH_DNS_PORT:-15353}:53/tcp'
    healthcheck:
      # The server answers GET / with its index page once the HTTP listener is up.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:80/']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '1', memory: 512m }

  # Temporal server (DEVENV-007). The auto-setup image creates its two databases (`temporal`,
  # `temporal_visibility`) on the dev Postgres and runs the schema migrations on every start.
  # Pinned to a known-good server (1.29.x): bumping it also bumps the schema, so do both together.
  temporal:
    <<: *defaults
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${BW_DEV_POSTGRES_SUPERUSER:-bw_admin}
      POSTGRES_PWD: ${BW_DEV_POSTGRES_SUPERUSER_PASSWORD:?set BW_DEV_POSTGRES_SUPERUSER_PASSWORD in .env (pnpm dev:deps creates it)}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # The blackwing-dev namespace is created by `temporal-bootstrap`, not here.
      SKIP_DEFAULT_NAMESPACE_CREATION: 'true'
      LOG_LEVEL: ${BW_DEV_TEMPORAL_LOG_LEVEL:-info}
      # Server metrics for the `obs` profile's Prometheus (not published to the host).
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    ports:
      - '127.0.0.1:${BW_DEV_TEMPORAL_PORT:-17233}:7233'
    healthcheck:
      test: ['CMD-SHELL', 'temporal operator cluster health --address "$$(hostname -i):7233"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: '2', memory: 1g }

  temporal-ui:
    <<: *defaults
    image: temporalio/ui:2.49.0@sha256:a8b78ea822ae3b0e6079acf84b521ecb75bdd6554c2716aaa97dc0c521364a57
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-blackwing-dev}
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - '127.0.0.1:${BW_DEV_TEMPORAL_UI_PORT:-18233}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }

  # One-shot: ensures the dev namespace (retention from BW_DEV_TEMPORAL_RETENTION) and the custom search
  # attributes exist. Idempotent; exits 0 so `up --wait` treats it as done.
  temporal-bootstrap:
    <<: *defaults
    restart: 'no'
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    depends_on:
      temporal: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/bw/bootstrap.sh']
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-blackwing-dev}
      BW_TEMPORAL_RETENTION: ${BW_DEV_TEMPORAL_RETENTION:-72h}
    volumes:
      - ./temporal/bootstrap.sh:/bw/bootstrap.sh:ro

  # ---------------------------------------------------------------------------------------------
  # Local vulnerable targets (DEVENV-012, profile `targets`). Deliberately-vulnerable TRAINING apps
  # used as authorised, local-only e2e assessment targets. Never part of `pnpm dev:deps`; start with
  # `pnpm targets:up`. They sit on the dedicated `bw-targets` network (NOT bw-dev) and publish to
  # 127.0.0.1 only. Images are pinned by digest so a target cannot drift (§8.9). See
  # infra/compose/README.md "Vulnerable targets".
  # ---------------------------------------------------------------------------------------------
  juice-shop:
    <<: *target
    image: bkimminich/juice-shop:v17.1.1@sha256:9e437b456e444ff001d1663e4f6f05c796fe02f1058dd2651d6791a15b43dfeb
    ports:
      - '127.0.0.1:${BW_TARGET_JUICE_SHOP_PORT:-13000}:3000'
    networks:
      bw-targets:
        aliases: [juice.bw.localhost]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/rest/admin/application-version').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }

  vampi:
    <<: *target
    image: erev0s/vampi:latest@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    environment:
      vulnerable: '1'
      tokentimetolive: '3600'
    ports:
      - '127.0.0.1:${BW_TARGET_VAMPI_PORT:-13020}:5000'
    networks:
      bw-targets:
        aliases: [vampi.bw.localhost]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }

  dvga:
    <<: *target
    image: dolevf/dvga:latest@sha256:040aa33c199d99f3380c9ff9a1ee5d725e9abca7b189c63a35a2a73bda79c957
    environment:
      WEB_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${BW_TARGET_DVGA_PORT:-13030}:5013'
    networks:
      bw-targets:
        aliases: [dvga.bw.localhost]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5013/').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 384m }

  dvwa:
    <<: *target
    # Needs a one-time DB setup after first start: open http://dvwa.bw.localhost:13040/setup.php and press
    # "Create / Reset Database". `pnpm targets:reset dvwa` restores a clean state.
    image: vulnerables/web-dvwa:latest@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    ports:
      - '127.0.0.1:${BW_TARGET_DVWA_PORT:-13040}:80'
    networks:
      bw-targets:
        aliases: [dvwa.bw.localhost]
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/80"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '1', memory: 512m }

  webgoat:
    <<: *target
    image: webgoat/webgoat:v2023.8@sha256:01672eb9aeba60d042ae1131d6de683b98fa64e9da60fa5d3daad2642a6795dd
    environment:
      WEBGOAT_PORT: '8080'
      WEBGOAT_SSLENABLED: 'false'
      WEBGOAT_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${BW_TARGET_WEBGOAT_PORT:-13050}:8080'
    networks:
      bw-targets:
        aliases: [webgoat.bw.localhost]
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1g }

  # crAPI is a multi-service app; only crapi (the web gateway) is published. The sidecars use the
  # upstream demo defaults (public, throwaway training values; none is a Blackwing secret).
  crapi-postgres:
    <<: *target
    image: postgres:14-alpine@sha256:4ea9e5ed06591da7ea23eb65465e8d3187fe79f4d5ec3ae976d29a33b013e77a
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    networks:
      bw-targets:
        aliases: [postgresdb]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d crapi']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  crapi-mongo:
    <<: *target
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    networks:
      bw-targets:
        aliases: [mongodb]
    healthcheck:
      test: ['CMD-SHELL', 'mongo --quiet --eval "db.runCommand({ping:1}).ok" | grep -q 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  crapi-mailhog:
    <<: *target
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    networks:
      bw-targets:
        aliases: [mailhog]

  crapi-identity:
    <<: *target
    image: crapi/crapi-identity:latest@sha256:5d1db5b3ba8e02bc68711ec6fc4e35ed7cd8b87e63785ece9e7ff5b5e36c5260
    environment: &crapi-env
      LOG_LEVEL: INFO
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: '5432'
      SERVER_PORT: '8080'
      ENABLE_SHELL_INJECTION: 'false'
      JWT_SECRET: crapi
      JWT_EXPIRATION: '604800000'
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: '1025'
      MAILHOG_DOMAIN: example.com
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      SMTP_EMAIL: user@example.com
      SMTP_PASS: xxxxxxxxxxxxxx
      SMTP_FROM: no-reply@example.com
      SMTP_AUTH: 'true'
      SMTP_STARTTLS: 'true'
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      TLS_ENABLED: 'false'
    depends_on:
      crapi-postgres: { condition: service_healthy }
      crapi-mailhog: { condition: service_started }
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 90s

  crapi-community:
    <<: *target
    image: crapi/crapi-community:latest@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
    environment:
      <<: *crapi-env
      SERVER_PORT: '8087'
      IDENTITY_SERVICE: crapi-identity:8080
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: '27017'
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
    depends_on:
      crapi-postgres: { condition: service_healthy }
      crapi-mongo: { condition: service_healthy }
      crapi-identity: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8087"']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  crapi-workshop:
    <<: *target
    image: crapi/crapi-workshop:latest@sha256:d4d2d94d35a31e211b04d5a771881f5ae13e358e8fa0804463ae3bace05dd815
    environment:
      <<: *crapi-env
      SERVER_PORT: '8000'
      IDENTITY_SERVICE: crapi-identity:8080
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: '27017'
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      SECRET_KEY: crapi
    depends_on:
      crapi-postgres: { condition: service_healthy }
      crapi-mongo: { condition: service_healthy }
      crapi-identity: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8000"']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  crapi:
    <<: *target
    image: crapi/crapi-web:latest@sha256:b27d246c646bd33898e7d1d2095b6e7576c0993a7b81a73aa7386929493d7151
    environment:
      COMMUNITY_SERVICE: crapi-community:8087
      IDENTITY_SERVICE: crapi-identity:8080
      WORKSHOP_SERVICE: crapi-workshop:8000
      MAILHOG_SERVICE: mailhog:8025
      TLS_ENABLED: 'false'
    ports:
      - '127.0.0.1:${BW_TARGET_CRAPI_PORT:-13010}:80'
    networks:
      bw-targets:
        aliases: [crapi.bw.localhost]
    depends_on:
      crapi-identity: { condition: service_healthy }
      crapi-community: { condition: service_healthy }
      crapi-workshop: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/80"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Observability profile `obs` (DEVENV-009): opt-in, `pnpm dev:deps:obs`. Not started by `pnpm dev:deps`.
  # The collector is the single OTLP ingest point (grpc 14317 / http 14318); it fans out to Prometheus
  # (scrape), Loki (OTLP logs) and Tempo (OTLP traces). Dev only, loopback ports, no external egress.
  # RAM: about 1.5 GB for the five services together (limits below).
  otel-collector:
    <<: *defaults
    image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
    profiles: [obs]
    # The config is validated at startup: a bad config exits non-zero and the container restarts loudly.
    command: ['--config=/etc/otelcol/config.yaml']
    depends_on:
      loki: { condition: service_healthy }
      tempo: { condition: service_started }
    ports:
      - '127.0.0.1:${BW_DEV_OTEL_GRPC_PORT:-14317}:4317'
      - '127.0.0.1:${BW_DEV_OTEL_HTTP_PORT:-14318}:4318'
      - '127.0.0.1:${BW_DEV_OTEL_HEALTH_PORT:-13133}:13133'
    volumes:
      - ./obs/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # The image is scratch (no shell/wget): readiness is the health_check extension on :13133, polled by
    # `pnpm dev:deps:obs` and the obs smoke test.
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512m }

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    profiles: [obs]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
    ports:
      - '127.0.0.1:${BW_DEV_PROMETHEUS_PORT:-19090}:9090'
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: '1', memory: 384m }

  loki:
    <<: *defaults
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    profiles: [obs]
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:${BW_DEV_LOKI_PORT:-13100}:3100'
    volumes:
      - ./obs/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '1', memory: 384m }

  tempo:
    <<: *defaults
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    profiles: [obs]
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - '127.0.0.1:${BW_DEV_TEMPO_PORT:-13200}:3200'
    volumes:
      - ./obs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    # Tempo's image has no shell/wget: its readiness (/ready) is probed by the obs smoke test over the
    # published port.
    deploy:
      resources:
        limits: { cpus: '1', memory: 384m }

  grafana:
    <<: *defaults
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    profiles: [obs]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${BW_DEV_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${BW_DEV_GRAFANA_ADMIN_PASSWORD:?set BW_DEV_GRAFANA_ADMIN_PASSWORD in .env (pnpm dev:deps creates it)}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/blackwing-overview.json
    ports:
      - '127.0.0.1:${BW_DEV_GRAFANA_PORT:-13001}:3000'
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '1', memory: 384m }

networks:
  bw-dev:
    name: bw-dev
    driver: bridge

  # Dedicated network for the vulnerable targets; deliberately separate from bw-dev (DEVENV-012).
  bw-targets:
    name: bw-targets
    driver: bridge

volumes:
  pgdata:
  valkeydata:
  neo4jdata:
  miniodata:
  promdata:
  lokidata:
  tempodata:
  grafanadata:
