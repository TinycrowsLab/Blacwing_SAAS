# Blackwing local dependency stack (DEVENV-002). Started by `pnpm dev:deps`.
#
# Rules (see infra/compose/README.md):
# - one shared project `bwdev` for every worktree; never `container_name:`;
# - host ports bind 127.0.0.1 only and are overridable via env (port already in use);
# - every image is pinned by tag AND digest (CONTEXT_PACK §8.9); Renovate bumps them;
# - credentials come from the untracked `.env` (`pnpm dev:deps` creates it from `.env.example`).
name: bwdev

x-defaults: &defaults
  restart: unless-stopped
  networks: [bw-dev]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    environment:
      POSTGRES_USER: ${BW_DEV_POSTGRES_SUPERUSER:-bw_admin}
      POSTGRES_PASSWORD: ${BW_DEV_POSTGRES_SUPERUSER_PASSWORD:?set BW_DEV_POSTGRES_SUPERUSER_PASSWORD in .env (pnpm dev:deps creates it)}
      POSTGRES_DB: ${BW_DEV_POSTGRES_DB:-blackwing}
      BW_APP_ROLE: ${BW_DEV_POSTGRES_APP_USER:-bw_app}
      BW_APP_PASSWORD: ${BW_DEV_POSTGRES_APP_PASSWORD:?set BW_DEV_POSTGRES_APP_PASSWORD in .env}
      BW_MIGRATOR_ROLE: ${BW_DEV_POSTGRES_MIGRATOR_USER:-bw_migrator}
      BW_MIGRATOR_PASSWORD: ${BW_DEV_POSTGRES_MIGRATOR_PASSWORD:?set BW_DEV_POSTGRES_MIGRATOR_PASSWORD in .env}
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=200']
    ports:
      - '127.0.0.1:${BW_DEV_POSTGRES_PORT:-15432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2g }

  valkey:
    <<: *defaults
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    environment:
      BW_VALKEY_PASSWORD: ${BW_DEV_VALKEY_PASSWORD:?set BW_DEV_VALKEY_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec valkey-server --appendonly yes --appendfsync everysec
        --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$BW_VALKEY_PASSWORD"
    ports:
      - '127.0.0.1:${BW_DEV_VALKEY_PORT:-16379}:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$BW_VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }

  neo4j:
    <<: *defaults
    image: neo4j:5.26-community@sha256:0a6e7aedf54a531f76286032d4365ead65b11cca05e4a15cdf23b8e53d6db02b
    # Wraps the stock entrypoint: starts Neo4j, then applies and verifies the tenantId guard
    # (neo4j/bootstrap/tenant-guard.cypher). The healthcheck passes only once the guard is proven.
    entrypoint: ['tini', '-g', '--', '/bw/bootstrap/start.sh']
    environment:
      NEO4J_AUTH: neo4j/${BW_DEV_NEO4J_PASSWORD:?set BW_DEV_NEO4J_PASSWORD in .env (min 8 chars)}
      BW_NEO4J_PASSWORD: ${BW_DEV_NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:${BW_DEV_NEO4J_HTTP_PORT:-17474}:7474'
      - '127.0.0.1:${BW_DEV_NEO4J_BOLT_PORT:-17687}:7687'
    volumes:
      - neo4jdata:/data
      - ./neo4j/conf:/conf:ro
      - ./neo4j/bootstrap:/bw/bootstrap:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -f /tmp/bw-tenant-guard.ok && cypher-shell -u neo4j -p "$${BW_NEO4J_PASSWORD}" "RETURN 1" >/dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2560m }

  # S3-compatible evidence/report/transcript store with Object Lock (DEVENV-006). Upstream MinIO no
  # longer publishes Docker Hub images, so this is Chainguard's unmodified source build (AGPLv3, used as a
  # separate dev service only), same image as packages/testing.
  minio:
    <<: *defaults
    image: cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${BW_DEV_MINIO_ROOT_USER:-bw_minio_root}
      MINIO_ROOT_PASSWORD: ${BW_DEV_MINIO_ROOT_PASSWORD:?set BW_DEV_MINIO_ROOT_PASSWORD in .env (min 8 chars)}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - '127.0.0.1:${BW_DEV_MINIO_PORT:-19000}:9000'
      - '127.0.0.1:${BW_DEV_MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      # The image has no curl/wget; `mc ready` polls GET /minio/health/ready (cluster readiness).
      test: ['CMD', '/usr/bin/mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }

  # Idempotent bootstrap job: buckets with object lock + versioning, default retention, scoped app key.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:0d96f662c23c9823874b47b6598cd7352edd9037891cba302d8fd3323dad295b
    restart: 'no'
    networks: [bw-dev]
    depends_on:
      minio: { condition: service_healthy }
    # Stays up after a successful bootstrap so `up --wait` can gate on the healthcheck below; a failed
    # bootstrap exits non-zero and fails `up`.
    entrypoint: ['/bin/bash', '-c', '/bw/minio/bootstrap.sh && exec sleep infinity']
    healthcheck:
      # So that `up --wait` blocks until the buckets exist (the script writes the marker last).
      test: ['CMD', '/bin/bash', '-c', 'test -f /tmp/bw-minio-bootstrap.ok']
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 5s
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${BW_DEV_MINIO_ROOT_USER:-bw_minio_root}
      MINIO_ROOT_PASSWORD: ${BW_DEV_MINIO_ROOT_PASSWORD:?set BW_DEV_MINIO_ROOT_PASSWORD in .env}
      BW_APP_ACCESS_KEY: ${BW_DEV_MINIO_APP_ACCESS_KEY:-bw_app_s3}
      BW_APP_SECRET_KEY: ${BW_DEV_MINIO_APP_PASSWORD:?set BW_DEV_MINIO_APP_PASSWORD in .env (min 8 chars)}
      BW_RETENTION_MODE: ${BW_DEV_MINIO_RETENTION_MODE:-GOVERNANCE}
      BW_RETENTION_DAYS: ${BW_DEV_MINIO_RETENTION_DAYS:-1}
    volumes:
      - ./minio:/bw/minio:ro

  # Dev TLS reverse proxy (DEVENV-013): terminates mkcert HTTPS for *.bw.localhost. Opt-in profile `tls`;
  # `pnpm dev:tls` runs infra/compose/tls/setup-tls.sh first. Apps on the host are reached via host-gateway.
  traefik:
    <<: *defaults
    image: traefik:v3.2@sha256:e561a37f8710d9cf41c78bdf421d822b2c0b48267ec0552e644565fb55466ea9
    profiles: [tls]
    command: ['--configFile=/etc/traefik/traefik.yml']
    environment:
      BW_TLS_UPSTREAM_WEB: ${BW_TLS_UPSTREAM_WEB:-http://host.docker.internal:3000}
      BW_TLS_UPSTREAM_API: ${BW_TLS_UPSTREAM_API:-http://host.docker.internal:13400}
      BW_TLS_UPSTREAM_KEYCLOAK: ${BW_TLS_UPSTREAM_KEYCLOAK:-http://keycloak:8080}
      BW_TLS_UPSTREAM_JUICE: ${BW_TLS_UPSTREAM_JUICE:-http://juice-shop:3000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # 443 needs privileges: default to high ports (set BW_DEV_TRAEFIK_HTTPS_PORT=443 where allowed).
      - '127.0.0.1:${BW_DEV_TRAEFIK_HTTPS_PORT:-18443}:443'
      - '127.0.0.1:${BW_DEV_TRAEFIK_HTTP_PORT:-18000}:80'
      - '127.0.0.1:${BW_DEV_TRAEFIK_DASHBOARD_PORT:-18082}:8080'
    volumes:
      - ./tls/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./tls/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./tls/certs:/certs:ro
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128m }

  # Local SMTP sink + web UI (DEVENV-008). Nothing is ever relayed: mail stays in Mailpit's in-memory store,
  # so dev cannot contact real recipients. Messages vanish on restart (see README for reset).
  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    environment:
      MP_MAX_MESSAGES: ${BW_DEV_MAILPIT_MAX_MESSAGES:-500}
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:${BW_DEV_MAILPIT_SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${BW_DEV_MAILPIT_UI_PORT:-18025}:8025'
    healthcheck:
      # Probes the web UI's /readyz.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }

  # Self-hosted out-of-band (OOB) callback server for the validator's OOB oracle (DEVENV-008). Local-only
  # mode: authenticated with a token, no ACME/TLS, interactions held in memory. Only the HTTP collaborator
  # API/callbacks and DNS are published; there is no public DNS delegation for the dev domain.
  interactsh:
    <<: *defaults
    image: projectdiscovery/interactsh-server:v1.2.4@sha256:ffde50de2cdc9113b9bb024d9dbe63a7a4826de213be1cc63a7ffd5fd3b14481
    command:
      - -domain
      - ${BW_DEV_INTERACTSH_DOMAIN:-oob.bw.localhost}
      - -ip
      - 127.0.0.1
      - -token
      - ${BW_DEV_INTERACTSH_TOKEN:?set BW_DEV_INTERACTSH_TOKEN in .env (pnpm dev:deps creates it)}
      - -skip-acme
      - -disable-update-check
      - -eviction
      - '1'
    ports:
      - '127.0.0.1:${BW_DEV_INTERACTSH_HTTP_PORT:-18081}:80'
      - '127.0.0.1:${BW_DEV_INTERACTSH_DNS_PORT:-15353}:53/udp'
      - '127.0.0.1:${BW_DEV_INTERACTSH_DNS_PORT:-15353}:53/tcp'
    healthcheck:
      # The server answers GET / with its index page once the HTTP listener is up.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:80/']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '1', memory: 512m }

networks:
  bw-dev:
    name: bw-dev
    driver: bridge

volumes:
  pgdata:
  valkeydata:
  neo4jdata:
  miniodata:
