# Traefik dynamic config (DEVENV-013, #167): *.bw.localhost routing over HTTPS.
# Go-template file: upstream URLs come from BW_TLS_UPSTREAM_* env vars set in docker-compose.dev.yml.
# Keep the hostnames in sync with the Keycloak redirect URIs (DEVENV-004) and the target apps (DEVENV-012).
# juice.bw.localhost is NOT routed here: this proxy sits on bw-dev only. It is served by the bw-targets-only
# edge (dynamic-targets.yml, service traefik-targets).
tls:
  certificates:
    - certFile: /certs/bw-localhost.pem
      keyFile: /certs/bw-localhost-key.pem
  options:
    default:
      minVersion: VersionTLS12

http:
  middlewares:
    # Redirect to the PUBLISHED HTTPS port (18443 by default), not the container's :443.
    to-https:
      redirectScheme:
        scheme: https
        port: '{{ env "BW_TLS_PUBLIC_HTTPS_PORT" | default "18443" }}'
        permanent: false # 302: browsers must not cache a dev redirect
    # No HSTS on purpose: it would pin *.localhost to HTTPS in the developer's browser for every project.
    dev-headers:
      headers:
        customResponseHeaders:
          X-Content-Type-Options: nosniff
        customRequestHeaders:
          X-Forwarded-Proto: https
  routers:
    http-to-https:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: noop@internal
      middlewares: [to-https]
    app:
      rule: Host(`app.bw.localhost`)
      entryPoints: [websecure]
      service: web
      tls: {}
      middlewares: [dev-headers]
    api:
      rule: Host(`api.bw.localhost`)
      entryPoints: [websecure]
      service: api
      tls: {}
      middlewares: [dev-headers]
    auth:
      rule: Host(`auth.bw.localhost`)
      entryPoints: [websecure]
      service: keycloak
      tls: {}
      middlewares: [dev-headers]
  services:
    web:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_WEB" }}' }]
    api:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_API" }}' }]
    keycloak:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_KEYCLOAK" }}' }]
