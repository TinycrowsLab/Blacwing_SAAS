# Traefik dynamic config (DEVENV-013, #167): *.bw.localhost routing over HTTPS.
# Go-template file: upstream URLs come from BW_TLS_UPSTREAM_* env vars set in docker-compose.dev.yml.
# Keep the hostnames in sync with the Keycloak redirect URIs (DEVENV-004) and the target apps (DEVENV-012).
tls:
  certificates:
    - certFile: /certs/bw-localhost.pem
      keyFile: /certs/bw-localhost-key.pem
  options:
    default:
      minVersion: VersionTLS12

http:
  middlewares:
    # No HSTS on purpose: it would pin *.localhost to HTTPS in the developer's browser for every project.
    dev-headers:
      headers:
        customResponseHeaders:
          X-Content-Type-Options: nosniff
        customRequestHeaders:
          X-Forwarded-Proto: https
  routers:
    app:
      rule: Host(`app.bw.localhost`)
      entryPoints: [websecure]
      service: web
      tls: {}
      middlewares: [dev-headers]
    api:
      rule: Host(`api.bw.localhost`)
      entryPoints: [websecure]
      service: api
      tls: {}
      middlewares: [dev-headers]
    auth:
      rule: Host(`auth.bw.localhost`)
      entryPoints: [websecure]
      service: keycloak
      tls: {}
      middlewares: [dev-headers]
    juice:
      rule: Host(`juice.bw.localhost`)
      entryPoints: [websecure]
      service: juice
      tls: {}
  services:
    web:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_WEB" }}' }]
    api:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_API" }}' }]
    keycloak:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_KEYCLOAK" }}' }]
    juice:
      loadBalancer:
        servers: [{ url: '{{ env "BW_TLS_UPSTREAM_JUICE" }}' }]
