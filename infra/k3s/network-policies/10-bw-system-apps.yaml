# Per-app least-privilege allows in bw-system (INFRA-011). Peers are named by
# app.kubernetes.io/name and port; there is no ipBlock and no allow-all. A peer-to-peer
# flow is declared on BOTH sides (egress on the caller, ingress on the callee), as
# NetworkPolicy requires. Ports follow the dev port map (CONTEXT_PACK §9).
# Run Broker API: 20-run-broker.yaml (ingress only from sandbox pods).
# Platform pods may resolve names through kube-dns only; sandboxes: 30-sandbox.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: bw-system
  labels:
    app.kubernetes.io/part-of: blackwing
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: bw-system
  labels:
    app.kubernetes.io/part-of: blackwing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: session-manager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 13400 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - { protocol: TCP, port: 7233 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - { protocol: TCP, port: 8200 }
---
