# Kill-switch halt-time SLOs (KILL-007, F33, CONTEXT_PACK 8.5): egress block p99 < 2 s, full halt p99 < 10 s.
# Metrics come from the worker (bw_kill_halt_ms, bw_kill_stage_latency_ms{stage}); labels are bounded (no per-run labels).
# scripts/kill-slo-rules.test.mjs checks the thresholds and feeds the rules synthetic histograms.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackwing-kill-slo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: blackwing
spec:
  groups:
    - name: blackwing.kill.recording
      rules:
        - record: blackwing:bw_kill_halt_ms:p50
          expr: histogram_quantile(0.50, sum by (le) (rate(bw_kill_halt_ms_bucket[1h])))
        - record: blackwing:bw_kill_halt_ms:p95
          expr: histogram_quantile(0.95, sum by (le) (rate(bw_kill_halt_ms_bucket[1h])))
        - record: blackwing:bw_kill_halt_ms:p99
          expr: histogram_quantile(0.99, sum by (le) (rate(bw_kill_halt_ms_bucket[1h])))
        - record: blackwing:bw_kill_stage_latency_ms:p50
          expr: histogram_quantile(0.50, sum by (le, stage) (rate(bw_kill_stage_latency_ms_bucket[1h])))
        - record: blackwing:bw_kill_stage_latency_ms:p95
          expr: histogram_quantile(0.95, sum by (le, stage) (rate(bw_kill_stage_latency_ms_bucket[1h])))
        - record: blackwing:bw_kill_stage_latency_ms:p99
          expr: histogram_quantile(0.99, sum by (le, stage) (rate(bw_kill_stage_latency_ms_bucket[1h])))
    - name: blackwing.kill.slo
      rules:
        - alert: KillEgressBlockSloBreached
          expr: blackwing:bw_kill_stage_latency_ms:p99{stage="egress"} > 2000
          labels:
            severity: critical
          annotations:
            summary: 'Kill egress block p99 is {{ $value }} ms over 1 h (budget 2000 ms)'
            description: 'The egress gateway is too slow to fail closed after a kill (CONTEXT_PACK 8.5).'
        - alert: KillFullHaltSloBreached
          expr: blackwing:bw_kill_halt_ms:p99 > 10000
          labels:
            severity: critical
          annotations:
            summary: 'Kill full-halt p99 is {{ $value }} ms over 1 h (budget 10000 ms)'
            description: 'Trigger to completion exceeded the 10 s budget (CONTEXT_PACK 8.5).'
        - alert: KillEndedUnhealthy
          expr: sum(increase(bw_kill_events_total{status=~"partially_halted|failed"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: 'A kill ended partially_halted or failed'
            description: 'Something kept running after a kill. Read the kill event and the kill.* audit trail, then re-run the stuck stage.'
