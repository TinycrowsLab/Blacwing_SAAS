# gVisor RuntimeClass (DEVENV-014, CONTEXT_PACK §5 "Sandbox isolation", ADR-0011).
# Every sandbox Pod sets runtimeClassName: gvisor; the sandbox admission policy
# (20-admission.yaml) rejects any Pod in a sandbox namespace that does not.
# The `runsc` handler is registered in containerd by host/config-v3.toml.tmpl.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: blackwing
handler: runsc
