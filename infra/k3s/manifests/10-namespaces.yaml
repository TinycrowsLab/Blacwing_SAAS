# Namespaces for the dev cluster (DEVENV-014).
#
# sandbox     agent sandboxes. Pod Security "restricted" is enforced (no hostPath,
#             no privileged, non-root, caps dropped, seccomp) and the Blackwing
#             sandbox admission policy (20-admission.yaml) adds the rest of the
#             §4.1 contract. Default-deny NetworkPolicy in 30-networkpolicy.yaml.
# bw-system   platform services a sandbox may reach (egress gateway, model
#             gateway, Run Broker API). In dev these are placeholders
#             (40-dev-placeholders.yaml) until the app charts land (INFRA).
# bw-dev-outside  dev-only stand-in for "the rest of the network": an
#             unrestricted service that sandboxes must NOT reach, used by
#             verify.sh to prove the NetworkPolicy is actually enforced.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    app.kubernetes.io/part-of: blackwing
    blackwing.io/sandbox: 'true'
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: bw-system
  labels:
    app.kubernetes.io/part-of: blackwing
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: bw-dev-outside
  labels:
    app.kubernetes.io/part-of: blackwing
    blackwing.io/dev-only: 'true'
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
