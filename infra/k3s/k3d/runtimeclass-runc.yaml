# k3d substitute RuntimeClass (DEVENV-014) for hosts where gVisor cannot run
# (e.g. WSL2 dev boxes). Same name as the real class so every manifest and the
# sandbox admission guard stay identical; only the handler differs. verify.sh
# --k3d reports the gVisor-kernel check as NOT VERIFIED, never as passed.
# install-dev.sh applies this ONLY with --k3d; the real path is 00-runtimeclass.yaml.
# OFFLINE-STUB(online-porting #886): gVisor runsc + k3s on an Ubuntu 24.04 dev host replaces this.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: blackwing
    blackwing.io/k3d-substitute: 'true'
handler: runc
