apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-realm-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: "{{ .Values.image.repository }}:{{ required "image.tag (pinned) is required" .Values.image.tag }}"
          command: ['node', 'scripts/keycloak-sync.mjs', 'apply']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          env:
            - { name: BW_ENVIRONMENT, value: {{ .Values.environment | quote }} }
            - { name: BW_KEYCLOAK_URL, value: {{ .Values.keycloakUrl | quote }} }
            - { name: BW_KEYCLOAK_PUBLIC_URL, value: {{ required "publicUrl is required" .Values.publicUrl | quote }} }
            - { name: BW_CONSOLE_ORIGIN, value: {{ required "consoleOrigin is required" .Values.consoleOrigin | quote }} }
            - name: BW_KEYCLOAK_ADMIN_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: admin-user } }
            - name: BW_KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: admin-password } }
            - name: BW_KEYCLOAK_API_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: api-secret } }
            - name: BW_KEYCLOAK_CLI_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: cli-secret } }
            # The platform-operator realm (#838) is synced by the same job.
            - name: BW_KEYCLOAK_OPERATOR_BFF_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: operator-bff-secret } }
            - name: BW_KEYCLOAK_OPERATOR_API_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: operator-api-secret } }
