# Prometheus scrape config for the dev `obs` profile (DEVENV-009). Add a job here to scrape a new target.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector # app metrics arriving over OTLP, re-exposed by the collector
    static_configs: [{ targets: ['otel-collector:8889'] }]
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: loki
    static_configs: [{ targets: ['loki:3100'] }]
  - job_name: tempo
    static_configs: [{ targets: ['tempo:3200'] }]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster # public in dev (MINIO_PROMETHEUS_AUTH_TYPE=public)
    static_configs: [{ targets: ['minio:9000'] }]
  - job_name: temporal # exposed by the temporal service (PROMETHEUS_ENDPOINT)
    static_configs: [{ targets: ['temporal:8000'] }]
