{{- if .Values.obs.enabled }}
{{- /*
Observability profile (DEVENV-009 logic). The OpenTelemetry Collector is the single OTLP ingest point: metrics go
to Prometheus (scrape), logs to Loki and traces to Tempo. Service names match the compose stack, so the configs in
files/obs work unchanged. Scale or disable the profile with obs.enabled, independently of the data plane.
*/ -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    {{- include "bw-deps.labels" (dict "component" "otel-collector" "ctx" $) | nindent 4 }}
data:
  config.yaml: |-
    {{- .Files.Get "files/obs/otel-collector.yaml" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "bw-deps.labels" (dict "component" "otel-collector" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8889
      targetPort: metrics
    - name: health
      port: 13133
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    {{- include "bw-deps.labels" (dict "component" "otel-collector" "ctx" $) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "bw-deps.labels" (dict "component" "otel-collector" "ctx" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: {{ include "bw-deps.image" (dict "ref" .Values.images.otelCollector) }}
          # The config is validated at startup: a bad config exits non-zero and the pod restarts loudly.
          args: ['--config=/etc/otelcol/config.yaml']
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
            - name: health
              containerPort: 13133
          # The image is scratch (no shell): readiness is the health_check extension on 13133.
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            {{- include "bw-deps.securityContext" . | nindent 12 }}
          {{- include "bw-deps.resources" .Values.obs.resources.otelCollector | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "bw-deps.labels" (dict "component" "prometheus" "ctx" $) | nindent 4 }}
data:
  prometheus.yml: |-
    {{- .Files.Get "files/obs/prometheus.yml" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "bw-deps.labels" (dict "component" "prometheus" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    {{- include "bw-deps.labels" (dict "component" "prometheus" "ctx" $) | nindent 4 }}
spec:
  accessModes: ['ReadWriteOnce']
  {{- include "bw-deps.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.obs.storage.prometheus }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "bw-deps.labels" (dict "component" "prometheus" "ctx" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        {{- include "bw-deps.labels" (dict "component" "prometheus" "ctx" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: {{ include "bw-deps.image" (dict "ref" .Values.images.prometheus) }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.obs.retention }}
            # k6 load runs push k6_* metrics here (infra/perf, PERF-001).
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            {{- include "bw-deps.securityContext" . | nindent 12 }}
          {{- include "bw-deps.resources" .Values.obs.resources.prometheus | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
