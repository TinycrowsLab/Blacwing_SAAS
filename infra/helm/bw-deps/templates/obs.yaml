              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            {{- include "bw-deps.securityContext" . | nindent 12 }}
          {{- include "bw-deps.resources" .Values.obs.resources.loki | nindent 10 }}
          volumeMounts:
            - name: config
