            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    {{- include "bw-deps.labels" (dict "component" "tempo" "ctx" $) | nindent 4 }}
data:
  tempo.yaml: |-
    {{- .Files.Get "files/obs/tempo.yaml" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    {{- include "bw-deps.labels" (dict "component" "tempo" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  labels:
    {{- include "bw-deps.labels" (dict "component" "tempo" "ctx" $) | nindent 4 }}
spec:
  accessModes: ['ReadWriteOnce']
  {{- include "bw-deps.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.obs.storage.tempo }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    {{- include "bw-deps.labels" (dict "component" "tempo" "ctx" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        {{- include "bw-deps.labels" (dict "component" "tempo" "ctx" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tempo
          image: {{ include "bw-deps.image" (dict "ref" .Values.images.tempo) }}
          args: ['-config.file=/etc/tempo/tempo.yaml']
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          # The Tempo image has no shell or wget: readiness is the HTTP /ready endpoint.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            {{- include "bw-deps.securityContext" . | nindent 12 }}
          {{- include "bw-deps.resources" .Values.obs.resources.tempo | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    {{- include "bw-deps.labels" (dict "component" "grafana" "ctx" $) | nindent 4 }}
data:
  datasources.yaml: |-
    {{- .Files.Get "files/obs/grafana/provisioning/datasources/datasources.yaml" | nindent 4 }}
  dashboards.yaml: |-
    {{- .Files.Get "files/obs/grafana/provisioning/dashboards/dashboards.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "bw-deps.labels" (dict "component" "grafana" "ctx" $) | nindent 4 }}
data:
  blackwing-overview.json: |-
    {{- .Files.Get "files/obs/grafana/dashboards/blackwing-overview.json" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "bw-deps.labels" (dict "component" "grafana" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    {{- include "bw-deps.labels" (dict "component" "grafana" "ctx" $) | nindent 4 }}
spec:
  accessModes: ['ReadWriteOnce']
  {{- include "bw-deps.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.obs.storage.grafana }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "bw-deps.labels" (dict "component" "grafana" "ctx" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        {{- include "bw-deps.labels" (dict "component" "grafana" "ctx" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: {{ include "bw-deps.image" (dict "ref" .Values.images.grafana) }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            {{- include "bw-deps.secretEnv" (dict "name" "GF_SECURITY_ADMIN_PASSWORD" "secret" .Values.obs.grafana.secretName "key" "admin-password") | nindent 12 }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: 'false'
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/blackwing-overview.json
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            {{- include "bw-deps.securityContext" . | nindent 12 }}
          {{- include "bw-deps.resources" .Values.obs.grafana.resources | nindent 10 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
{{- end }}
