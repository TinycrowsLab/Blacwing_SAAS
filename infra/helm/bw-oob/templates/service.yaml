apiVersion: v1
kind: Service
metadata:
  name: {{ include "bw-oob.name" . }}
  labels:
    {{- include "bw-oob.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bw-oob.selectorLabels" . | nindent 4 }}
  ports:
    # Control plane (poll API, health). Reachable from controlPlaneNamespaces only (networkpolicy.yaml).
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
