{{- include "bw-oob.validate" . -}}
# Wildcard for the delegated zone, so HTTPS and SMTPS interactions validate (DNS-01 through the
# ClusterIssuer's Route53 solver from bw-ingress). cert-manager renews it automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    {{- include "bw-oob.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  dnsNames:
    - {{ printf "*.%s" (include "bw-oob.fqdn" .) | quote }}
    - {{ include "bw-oob.fqdn" . | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.tls.issuer }}
  duration: {{ .Values.tls.duration }}
  renewBefore: {{ .Values.tls.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
