# pnpm workspace members. Every member directory holds a package.json named
# `@blackwing/<dir>`. apps/egress-gateway is a member only through its package.json;
# its Go module (FOUND-013) is built by Go tooling and is not part of the JS workspace.
# Layout is enforced by scripts/check-layout.mjs (also run by the root preinstall hook).
packages:
  - 'apps/*'
  - 'packages/*'

# Single pinned version for shared tooling, referenced from members as "catalog:".
# Vitest is the unit-test runner fixed in CONTEXT_PACK §5; its shared presets are @blackwing/testing/vitest-config (FOUND-012).
# TypeScript 5.x and Node 22 typings back the strict project-reference build (FOUND-003,
# docs/architecture/typescript.md); every TS member pulls them in as devDependencies.
# @cedar-policy/cedar-wasm is the TS Cedar engine fixed in CONTEXT_PACK §5 (schema first validated by @blackwing/policy, POLICY-001).
# Zod is the boundary-validation library fixed in CONTEXT_PACK §5 (first used by @blackwing/config, FOUND-007).
# Ajv (+ ajv-formats) checks committed JSON Schema artifacts against the Zod fixtures in tests (AUDIT-001).
# fast-check backs the property tests §5 calls for (first used by @blackwing/ids, FOUND-010).
# pino is the structured logger fixed in §5, pino-pretty its NODE_ENV=development-only pretty
# transport, and @opentelemetry/api the OTel API the logger reads trace context from (first used by
# @blackwing/logger, FOUND-008). @opentelemetry/context-async-hooks is the Node context manager the
# telemetry package registers; the logger uses it only in tests.
# prom-client is the Prometheus /metrics registry of apps/model-gateway (GATEWAY-001, #404),
# @opentelemetry/core its W3C trace-context propagator and @opentelemetry/sdk-trace-base the
# in-memory span exporter its tests assert spans with. @opentelemetry/sdk-node and its OTLP gRPC exporters,
# sdk-metrics, sdk-logs and resources are the SDK @blackwing/telemetry boots (OBS-001, #298); they are pinned to
# the 0.223 / 2.12 release train that sdk-node 0.223.0 itself depends on.
# NestJS 11 on the Fastify adapter is the control-plane API framework fixed in §5 (apps/api, API-001,
# #53), with reflect-metadata and rxjs as its required peers and @fastify/helmet, @fastify/cors and
# @fastify/request-context as its HTTP plugins (@fastify/cors pinned to the copy the adapter bundles).
# @anthropic-ai/claude-agent-sdk is the agent runtime SDK fixed in §4/§5; mcp-tools builds its in-process MCP servers on
# tool() + createSdkMcpServer() (MCP-001, #666). @modelcontextprotocol/sdk is that SDK's peer (tool-result types).
# TanStack Query is the console's server-state library fixed in §5 (apps/web data layer, CONSOLE-005, #265).
