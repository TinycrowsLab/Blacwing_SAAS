# pnpm workspace members. Every member directory holds a package.json named
# `@blackwing/<dir>`. apps/egress-gateway is a member only through its package.json;
# its Go module (FOUND-013) is built by Go tooling and is not part of the JS workspace.
# Layout is enforced by scripts/check-layout.mjs (also run by the root preinstall hook).
packages:
  - 'apps/*'
  - 'packages/*'

# Single pinned version for shared tooling, referenced from members as "catalog:".
# Vitest is the unit-test runner fixed in CONTEXT_PACK §5; its shared preset lands with FOUND-012.
# TypeScript 5.x and Node 22 typings back the strict project-reference build (FOUND-003,
# docs/architecture/typescript.md); every TS member pulls them in as devDependencies.
# Zod is the boundary-validation library fixed in CONTEXT_PACK §5 (first used by @blackwing/config, FOUND-007).
# fast-check backs the property tests §5 calls for (first used by @blackwing/ids, FOUND-010).
catalog:
  '@types/node': 22.20.5
  fast-check: 4.10.2
  typescript: 5.9.3
  vitest: 3.2.4
  zod: 4.6.7
